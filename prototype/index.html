<title>Valanga</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: a single phone-shaped column. Gauges on top, the dam and tower in the middle, controls under the thumb.
   Look: a hydroelectric plant at night. One deliberate dark world, so no light theme. */
:root {
  --ground: #0d2229;
  --ground-deep: #081820;
  --panel: #15333d;
  --panel-line: #2a525e;
  --concrete: #b8b1a2;
  --concrete-dark: #7f7a6f;
  --ink: #eef3ee;
  --muted: #92aeb2;
  --ball: #ffc23d;
  --split: #53e6bd;
  --value: #ff7a9c;
  --hazard: #f5b81f;
  --font-display: "Bowlby One", "Arial Black", Impact, sans-serif;
  --font-body: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--ground-deep);
  color: var(--ink);
  font-family: var(--font-body);
  font-weight: 600;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#stage {
  position: relative;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  width: min(100%, 56dvh);
  height: 100%;
  margin-inline: auto;
  background: var(--ground);
  overflow: hidden;
  touch-action: manipulation;
}

#hud {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding-block: 10px 8px;
  padding-inline: 16px;
}
.readout { display: grid; gap: 1px; min-width: 0; }
.readout .label {
  font-size: 11px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
}
#coins { font-family: var(--font-display); font-size: 30px; line-height: 1.05; color: var(--ball); font-variant-numeric: tabular-nums; }
#income { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.hud-side { display: grid; justify-items: end; gap: 4px; }
#live { font-family: var(--font-display); font-size: 18px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tools { display: flex; gap: 6px; }
.tool {
  appearance: none;
  border: 1px solid var(--panel-line);
  border-radius: 6px;
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: 12px;
  padding: 3px 8px;
  cursor: pointer;
}
.tool:focus-visible, #dam-btn:focus-visible, .shop-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

#field { position: relative; min-height: 0; }
#field canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#stats {
  position: absolute;
  left: 6px;
  bottom: 8px;
  padding-inline: 5px;
  background: var(--ground-deep);
  font-size: 11px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  pointer-events: none;
}
#result {
  position: absolute;
  inset-inline: 16px;
  top: 34%;
  display: grid;
  justify-items: center;
  gap: 2px;
  padding-block: 14px;
  background: color-mix(in srgb, var(--ground-deep) 82%, transparent);
  border-block: 3px solid var(--hazard);
  pointer-events: none;
  animation: slam .32s cubic-bezier(.2, 1.5, .4, 1);
}
#result .big { font-family: var(--font-display); font-size: 40px; line-height: 1.1; color: var(--ball); text-align: center; overflow-wrap: anywhere; }
#result .small { font-size: 15px; color: var(--ink); text-align: center; }
#result .record { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--split); }
@keyframes slam { from { transform: scale(1.5); opacity: 0; } to { transform: none; opacity: 1; } }

#controls {
  display: grid;
  gap: 8px;
  padding-block: 8px 12px;
  padding-inline: 16px;
  background: var(--panel);
  border-top: 2px solid var(--panel-line);
}
#dam-btn {
  --fill: 0%;
  position: relative;
  appearance: none;
  border: 0;
  border-radius: 8px;
  padding-block: 9px 7px;
  background: linear-gradient(90deg, var(--hazard) var(--fill), var(--ground) var(--fill));
  color: var(--ink);
  font: inherit;
  cursor: pointer;
  overflow: hidden;
}
#dam-btn .main { display: block; font-family: var(--font-display); font-size: 22px; line-height: 1.1; color: inherit; }
#dam-btn .sub { display: block; font-size: 13px; font-variant-numeric: tabular-nums; }
#dam-btn.ready { color: var(--ground-deep); background: var(--hazard); }
#dam-btn.full { animation: throb .7s ease-in-out infinite alternate; }
#dam-btn:disabled { cursor: default; }
@keyframes throb { from { transform: scale(1); } to { transform: scale(1.025); filter: brightness(1.15); } }

#tabs { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 2px; }
.tab {
  position: relative;
  display: grid;
  justify-items: center;
  gap: 2px;
  min-width: 0;
  appearance: none;
  border: 1px solid transparent;
  border-radius: 6px;
  padding: 4px 1px;
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: 12px;
  cursor: pointer;
}
.tab[aria-selected="true"] { background: var(--ground); border-color: var(--panel-line); color: var(--ink); }
.tab:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
.tab .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--dot); }
.tab.plant .dot { border-radius: 2px; }
.tab.locked { opacity: .55; }
.tab.locked .dot { background: transparent; box-shadow: inset 0 0 0 2px var(--dot); }
.tab.alert::after {
  content: "";
  position: absolute;
  top: 3px;
  right: 6px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--ball);
}
#rebuild-panel {
  position: absolute;
  inset-inline: 16px;
  top: 22%;
  z-index: 2;
  display: grid;
  gap: 10px;
  padding: 16px;
  background: var(--ground-deep);
  border: 2px solid var(--split);
  border-radius: 10px;
}
#rebuild-panel h2 { margin: 0; font-family: var(--font-display); font-size: 21px; font-weight: 400; color: var(--split); }
#rebuild-panel p { margin: 0; font-size: 15px; line-height: 1.3; }
.rebuild-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.rebuild-actions button {
  appearance: none;
  border: 1px solid var(--panel-line);
  border-radius: 8px;
  padding-block: 10px;
  background: var(--ground);
  color: var(--ink);
  font: inherit;
  font-size: 15px;
  cursor: pointer;
}
.rebuild-actions button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.rebuild-actions #rebuild-yes { border-color: var(--split); background: var(--split); color: var(--ground-deep); font-weight: 700; }
.shop-btn.perma { border-color: var(--split); }
.shop-btn.perma .cost { color: var(--split); }
#shop { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 8px; min-height: 116px; }
#hint {
  position: absolute;
  inset-inline: 16px;
  bottom: 34px;
  font-size: 14px;
  color: var(--ink);
  text-align: center;
  pointer-events: none;
}
.shop-btn {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  grid-template-rows: auto auto;
  column-gap: 8px;
  align-items: baseline;
  min-width: 0;
  appearance: none;
  border: 1px solid var(--panel-line);
  border-radius: 8px;
  padding: 6px 9px;
  background: var(--ground);
  color: var(--ink);
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.shop-btn.wide { grid-column: 1 / -1; grid-row: span 2; align-content: center; }
.shop-btn.span { grid-column: 1 / -1; }
.shop-btn .effect { line-height: 1.2; }
.shop-btn.wide .effect { white-space: normal; }
.shop-btn .name { font-size: 15px; font-weight: 700; }
.shop-btn .cost { font-size: 15px; font-weight: 700; color: var(--ball); font-variant-numeric: tabular-nums; }
.shop-btn .effect { grid-column: 1 / -1; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.shop-btn:disabled { cursor: default; opacity: .5; }
.shop-btn:not(:disabled):active { transform: translateY(1px); }
.shop-btn.buy { border-color: var(--ball); }

#rotate { display: none; }
@media (orientation: landscape) and (max-height: 520px) {
  #rotate {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: grid;
    place-items: center;
    padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
    background: var(--ground-deep);
    color: var(--ink);
    font-size: 18px;
    text-align: center;
  }
}

@media (prefers-reduced-motion: reduce) {
  #dam-btn.full { animation: none; }
  #result { animation: none; }
}
</style>

<div id="rotate">Gira il telefono in verticale per giocare.</div>
<div id="stage">
  <header id="hud">
    <div class="readout">
      <span class="label">Monete</span>
      <span id="coins">0</span>
      <span id="income">0 al secondo</span>
    </div>
    <div class="hud-side">
      <div class="readout" style="justify-items:end">
        <span class="label">Palline in gioco</span>
        <span id="live">0</span>
      </div>
      <div class="tools">
        <button class="tool" id="mute-btn" type="button">Audio sì</button>
        <button class="tool" id="reset-btn" type="button">Ricomincia</button>
      </div>
    </div>
  </header>

  <main id="field">
    <canvas id="bg"></canvas>
    <canvas id="gl"></canvas>
    <canvas id="fx"></canvas>
    <div id="stats"></div>
    <div id="result" hidden></div>
    <section id="rebuild-panel" role="dialog" aria-labelledby="rebuild-title" hidden>
      <h2 id="rebuild-title">Ricostruire la diga?</h2>
      <p id="rebuild-gain"></p>
      <p>Perdi monete, palline, diga e torre. Tieni cristalli, potenziamenti permanenti e record.</p>
      <div class="rebuild-actions">
        <button id="rebuild-no" type="button">Annulla</button>
        <button id="rebuild-yes" type="button">Ricostruisci</button>
      </div>
    </section>
    <div id="hint" hidden>Tocca lo schermo per caricare più in fretta</div>
  </main>

  <section id="controls">
    <button id="dam-btn" type="button">
      <span class="main">APRI LA DIGA</span>
      <span class="sub">0%</span>
    </button>
    <div id="tabs" role="tablist" aria-label="Palline, diga e torre"></div>
    <div id="shop">
      <button class="shop-btn" id="slot-0" type="button"></button>
      <button class="shop-btn" id="slot-1" type="button"></button>
      <button class="shop-btn" id="slot-2" type="button"></button>
      <button class="shop-btn" id="slot-3" type="button"></button>
    </div>
  </section>
</div>

<script>
'use strict';
/* ========================= Tuning ========================= */
const TUNE = {
  capBase: 30, capGrow: 1.7,
  leakBase: 0.1,        // balls per second that always slip through the gap
  leakPerBall: 0.03,    // share of the stored balls escaping each second: the pressure
  sealGrow: 0.85,
  rateSteps: [1, 2, 3, 5, 8, 12], rateGrow: 1.14,      // the first levels are deliberately huge
  valueSteps: [1, 2, 4, 6], valueGrow: 1.3,
  bonusBase: 1.5, bonusStep: 0.5,                      // valanga value = 1 + bonus * pressure^3
  minOpen: 0.2,
  costCap: [25, 3.4],
  costSeal: [60, 5],
  costBonus: [500, 6],
  costGate: [15, 5.5],
  costBoost: [2e9, 6],
  costFloor: [20000, 8e6],
  crystalScale: 1e5,                  // crystals = cube root of run coins / scale
  permRate: 1.25, permValue: 1.3, permCap: 1.2,
  costPerm: [2, 1.9],
};
/* Balls are born behind the dam, one type at a time, and only leave through the gap. */
const BALLS = [
  {
    id: 'biglia', name: 'Biglia', hex: '#ffc23d', r: 0.0085, rate: 0.1, value: 1,
    grav: 1.5, bounce: 0.45, maxVy: 0.95, tapBoost: 0.1, unlock: 0,
    costs: { rate: [3, 2.7], value: [6, 2.9], perk: [60, 3] },
    perkName: 'Gemelle', perkMax: 10,
    perkText: l => `${l * 10}% → ${(l + 1) * 10}% di doppie`,
  },
  {
    id: 'grandine', name: 'Grandine', hex: '#8fe8ff', r: 0.0055, rate: 0.2, value: 0.4,
    grav: 1.2, bounce: 0.55, maxVy: 0.8, tapBoost: 0.1, unlock: 300,
    costs: { rate: [80, 3.2], value: [120, 3.4], perk: [600, 3.4] },
    perkName: 'Raffica', perkMax: 12,
    perkText: l => `${4 + l} → ${5 + l} chicchi a colpo`,
    blurb: 'Piccola e leggera: arriva a raffiche e alza subito la pressione.',
  },
  {
    id: 'piombo', name: 'Piombo', hex: '#a9b8d6', r: 0.0125, rate: 0.05, value: 10,
    grav: 2.2, bounce: 0.12, maxVy: 1.25, tapBoost: 0.04, unlock: 40000,
    costs: { rate: [8000, 3.4], value: [12000, 3.6], perk: [50000, 3.6] },
    perkName: 'Zavorra', perkMax: 8,
    perkText: l => `+${l * 25}% → +${(l + 1) * 25}% a barriera`,
    blurb: 'Pesante e rara: cade veloce, rimbalza poco e vale molto.',
  },
  {
    id: 'cometa', name: 'Cometa', hex: '#c66bff', r: 0.011, rate: 0.02, value: 60,
    grav: 1.5, bounce: 0.6, maxVy: 1.05, tapBoost: 0.02, unlock: 2e6,
    costs: { rate: [4e5, 3.4], value: [8e5, 3.6], perk: [1e7, 30] },
    perkName: 'Scia', perkMax: 2,
    perkText: l => `barriere valore ^${fmtMult(1.5 + l * 0.25)} → ^${fmtMult(1.75 + l * 0.25)}`,
    blurb: 'Rarissima: le barriere valore la moltiplicano molto di più.',
  },
];
const PLANT_TAB = BALLS.length, DAM_TAB = PLANT_TAB, TOWER_TAB = PLANT_TAB + 1, CRYSTAL_TAB = PLANT_TAB + 2;
const MAX_FLOORS = 3;
const GATE_PLAN = [
  [['split', 2], ['value', 2], ['split', 2]],
  [['split', 3], ['value', 3], ['split', 3]],
  [['split', 4], ['value', 5], ['split', 4]],
];
const SLOTS = [
  { y: 0.3, x0: 0.06, x1: 0.5 },
  { y: 0.3, x0: 0.5, x1: 0.94 },
  { y: 0.6, x0: 0.2, x1: 0.8 },
];

/* ========================= State ========================= */
const SAVE_KEY = 'valanga.v3';
function freshState() {
  return {
    coins: 0, total: 0, damLv: 0, sealLv: 0, bonusLv: 0, gates: 1, floors: 1, boost: 0, best: 0,
    owned: BALLS.map((b, i) => i === 0),
    lv: BALLS.map(() => ({ rate: 0, value: 0, perk: 0 })),
    store: BALLS.map(() => 0),
    crystals: 0, runs: 0, perm: { rate: 0, value: 0, cap: 0 },
    tab: 0, tapped: false, savedAt: Date.now(),
  };
}
const S = freshState();
try {
  const raw = localStorage.getItem(SAVE_KEY);
  if (raw) Object.assign(S, JSON.parse(raw));
} catch (e) { /* storage may be blocked: the game still runs */ }
function save() {
  S.savedAt = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* ignored */ }
}

const stepped = (steps, grow, lv) => (lv < steps.length ? steps[lv] : steps[steps.length - 1] * Math.pow(grow, lv - steps.length + 1));
const rateAt = (i, lv) => BALLS[i].rate * stepped(TUNE.rateSteps, TUNE.rateGrow, lv) * Math.pow(TUNE.permRate, S.perm.rate);
const valueAt = (i, lv) => BALLS[i].value * stepped(TUNE.valueSteps, TUNE.valueGrow, lv) * Math.pow(TUNE.permValue, S.perm.value);
const rateOf = i => rateAt(i, S.lv[i].rate);
const valueOf = i => valueAt(i, S.lv[i].value);
const damCap = () => TUNE.capBase * Math.pow(TUNE.capGrow, S.damLv) * Math.pow(TUNE.permCap, S.perm.cap);
const crystalGain = () => Math.floor(Math.cbrt(S.total / TUNE.crystalScale));
const crystalsVisible = () => S.crystals > 0 || S.runs > 0 || crystalGain() >= 1;
const damTotal = () => S.store.reduce((a, b) => a + b, 0);
const damFill = () => Math.min(1, damTotal() / damCap());
const leakK = () => TUNE.leakPerBall * Math.pow(TUNE.sealGrow, S.sealLv);
const leakRate = () => (damTotal() > 0 ? TUNE.leakBase + leakK() * damTotal() : 0);
const bonusMax = () => TUNE.bonusBase + TUNE.bonusStep * S.bonusLv;
const pressure = (f = damFill()) => 1 + bonusMax() * f * f * f;

/* Per-kind values read by the simulation loop, refreshed after every purchase. */
const KRate = new Float64Array(BALLS.length), KVal = new Float64Array(BALLS.length);
const KPellets = new Float64Array(BALLS.length), KTwin = new Float64Array(BALLS.length), KFlow = new Float64Array(BALLS.length);
const KBonus = new Float64Array(BALLS.length), KReps = new Float64Array(BALLS.length);
const KGrav = Float32Array.from(BALLS, b => b.grav), KBounce = Float32Array.from(BALLS, b => b.bounce);
const KMaxVy = Float32Array.from(BALLS, b => b.maxVy), KR = Float32Array.from(BALLS, b => b.r);
function refreshKinds() {
  BALLS.forEach((b, i) => {
    KRate[i] = S.owned[i] ? rateOf(i) : 0;
    KVal[i] = valueOf(i);
    KPellets[i] = 1; KTwin[i] = 0; KBonus[i] = 1; KReps[i] = 1;
  });
  KTwin[0] = S.lv[0].perk * 0.1;
  KPellets[1] = 4 + S.lv[1].perk;
  KBonus[2] = 1 + S.lv[2].perk * 0.25;
  KReps[3] = 1.5 + S.lv[3].perk * 0.25;
  BALLS.forEach((b, i) => { KFlow[i] = KRate[i] * KPellets[i] * (1 + KTwin[i]); });
}
refreshKinds();

/* ========================= Particles (structure of arrays) ========================= */
const MAX = 80000;
const PILE_MAX = 600;   // balls with real collisions behind the dam
const BODY_MAX = 560;  // the rest of the stock is counted, not simulated
const px = new Float32Array(MAX), py = new Float32Array(MAX);
const vx = new Float32Array(MAX), vy = new Float32Array(MAX);
const rad = new Float32Array(MAX);
const val = new Float64Array(MAX), wt = new Float64Array(MAX);
const col = new Uint32Array(MAX), mask = new Uint32Array(MAX);
const isFlood = new Uint8Array(MAX), kind = new Uint8Array(MAX);
let n = 0;
let softCap = 60000;
let liveLogical = 0;

const PEG_R = 0.011;
const PEG_DX = 0.09;
const ROW_GAP = 0.082;
const COLLIDE = PEG_R + 0.006;
const MAX_VX = 0.6;

function rgb(hex) {
  const v = parseInt(hex.slice(1), 16);
  return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
}
function packRGB(hex, whiten) {
  const [r, g, b] = rgb(hex).map(c => Math.round(c + (255 - c) * whiten));
  return ((255 << 24) | (b << 16) | (g << 8) | r) >>> 0;
}
/* A ball keeps its hue and turns paler as gates multiply its value. */
const COLS = BALLS.map(b => [0, 0.15, 0.3, 0.45].map(m => packRGB(b.hex, m)));
function ballColor(k, v) {
  const t = Math.floor(Math.log(Math.max(1, v / KVal[k])) / Math.log(3));
  return COLS[k][Math.min(3, t)];
}

function spawn(x, y, vxi, vyi, value, weight, r, flooded, m, k) {
  if (n >= MAX) return -1;
  const i = n++;
  px[i] = x; py[i] = y; vx[i] = vxi; vy[i] = vyi;
  val[i] = value; wt[i] = weight; rad[i] = r; kind[i] = k;
  col[i] = ballColor(k, value); mask[i] = m; isFlood[i] = flooded;
  liveLogical += weight;
  if (flooded) floodLive++;
  return i;
}
function removeAt(i) {
  const j = --n;
  if (i === j) return;
  px[i] = px[j]; py[i] = py[j]; vx[i] = vx[j]; vy[i] = vy[j];
  val[i] = val[j]; wt[i] = wt[j]; rad[i] = rad[j];
  col[i] = col[j]; mask[i] = mask[j]; isFlood[i] = isFlood[j]; kind[i] = kind[j];
}

/* ========================= Board geometry ========================= */
const view = { W: 390, H: 520, resPx: 100, dpr: 1 };
let A = 1.1, RES = 0.26;     // board height and reservoir height, in widths
const DAM_T = 0.032;         // dam wall thickness, in widths
let floorH = A, rowCount = 0;
let rowOn = new Uint8Array(0);
let gates = [];
const funnelStart = 0.8;
const FUNNEL_GAPS = [[0.3, 0.7], [0.5], []];

function layout() {
  floorH = A / S.floors;
  rowCount = Math.ceil(A / ROW_GAP);
  rowOn = new Uint8Array(rowCount);
  for (let k = 0; k < rowCount; k++) {
    const y = (k + 0.5) * ROW_GAP;
    const f = Math.min(S.floors - 1, Math.floor(y / floorH));
    const local = y - f * floorH;
    const inFunnel = f < S.floors - 1 && local > floorH * (funnelStart - 0.04);
    rowOn[k] = (y > 0.03 && y < A - 0.05 && !inFunnel) ? 1 : 0;
  }
  const old = gates;
  gates = [];
  for (let i = 0; i < S.gates; i++) {
    const f = Math.floor(i / 3), s = i % 3;
    const [type, m] = GATE_PLAN[f][s];
    const slot = SLOTS[s];
    const y = Math.round((f * floorH + floorH * slot.y) / ROW_GAP) * ROW_GAP;

  view.W = rect.width; view.H = rect.height;
  view.dpr = Math.min(2, window.devicePixelRatio || 1);
  view.resPx = Math.min(view.H * 0.21, view.W * 0.3);
  RES = view.resPx / view.W;
  A = (view.H - view.resPx) / view.W;
  for (const c of [bgCanvas, glCanvas, fxCanvas]) {
    c.width = Math.round(view.W * view.dpr);
    c.height = Math.round(view.H * view.dpr);
  }
  if (gl) gl.viewport(0, 0, glCanvas.width, glCanvas.height);
  layout();
}
const WX = x => x * view.W;
const WY = y => view.resPx + y * view.W;

function drawBg() {
  const c = bgCtx, W = view.W, H = view.H;
  c.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  c.clearRect(0, 0, W, H);
  c.fillStyle = C.deep;
  c.fillRect(0, 0, W, view.resPx);
  for (let f = 0; f < S.floors; f++) {
    c.fillStyle = f % 2 ? C.panel : C.ground;
    c.fillRect(0, WY(f * floorH), W, floorH * W + 1);
  }
  c.fillStyle = C.line;
  for (let k = 0; k < rowCount; k++) {
    if (!rowOn[k]) continue;
    const y = WY((k + 0.5) * ROW_GAP), off = (k & 1) ? PEG_DX * 0.5 : 0;
    for (let i = 0; i * PEG_DX + off <= 1.0001; i++) {
      c.beginPath();
      c.arc(WX(i * PEG_DX + off), y, PEG_R * W, 0, 6.283);
      c.fill();
    }
  }
  c.lineWidth = 3;
  c.strokeStyle = C.concreteDark;
  c.lineCap = 'round';
  for (let f = 0; f < S.floors - 1; f++) {
    const bottom = (f + 1) * floorH, top = f * floorH + floorH * funnelStart;
    const gaps = FUNNEL_GAPS[f], half = 0.05;
    const edges = [0, ...gaps.flatMap(g => [g - half, g + half]), 1];
    for (let i = 0; i < edges.length; i += 2) {
      const a = edges[i], b = edges[i + 1], mid = (a + b) / 2;
      c.beginPath();
      if (a === 0) { c.moveTo(WX(0), WY(top)); c.lineTo(WX(b), WY(bottom)); }
      else if (b === 1) { c.moveTo(WX(1), WY(top)); c.lineTo(WX(a), WY(bottom)); }
      else { c.moveTo(WX(a), WY(bottom)); c.lineTo(WX(mid), WY(top)); c.lineTo(WX(b), WY(bottom)); }
      c.stroke();
    }
  }
  c.font = `600 11px ${fontBody}`;
  c.textAlign = 'left';
  c.fillStyle = C.muted;
  for (let f = 0; f < S.floors; f++) c.fillText(`PIANO ${f + 1}`, 8, WY(f * floorH) + 15);
  c.fillStyle = C.concreteDark;
  c.fillRect(0, H - 5, W, 5);
}

function drawDam(c, f) {
  const W = view.W, top = view.resPx - DAM_T * W, h = DAM_T * W;
  const halfOpen = doorOpen * W * 0.5;
  const gap = 0.028 * W, slopePx = FLOOR_SLOPE * W;
  const fy = dist => top - slopePx * (dist / W);   // height of the sloped floor at a distance from the centre
  c.fillStyle = C.concrete;
  c.beginPath();
  c.moveTo(-2 - halfOpen, top + h); c.lineTo(W / 2 - gap - halfOpen, top + h);
  c.lineTo(W / 2 - gap - halfOpen, fy(gap)); c.lineTo(-2 - halfOpen, fy(W / 2));
  c.closePath();
  c.moveTo(W + 2 + halfOpen, top + h); c.lineTo(W / 2 + gap + halfOpen, top + h);
  c.lineTo(W / 2 + gap + halfOpen, fy(gap)); c.lineTo(W + 2 + halfOpen, fy(W / 2));
  c.closePath();
  c.fill();
  c.fillStyle = C.concreteDark;
  c.fillRect(-2 - halfOpen, top + h - 3, W / 2 - gap + 2, 3);
  c.fillRect(W / 2 + gap + halfOpen, top + h - 3, W / 2 - gap + 2, 3);
  // Marks how high the stock can reach; a higher dam moves it up.
  const capHeight = Math.min(RES - 0.05, Math.min(damCap(), BODY_MAX) * 0.00028);
  const capY = top - capHeight * W - 0.015 * W;
  c.strokeStyle = C.hazard;
  c.lineWidth = 1;
  c.setLineDash([6, 5]);
  c.beginPath(); c.moveTo(0, capY); c.lineTo(W - 24, capY); c.stroke();
  c.setLineDash([]);
  if (f >= 0.9 && doorOpen < 0.05) {
    const sy = top + h - 5;
    c.save();
    c.beginPath(); c.rect(0, sy, W, 5); c.clip();
    c.fillStyle = C.hazard;
    c.fillRect(0, sy, W, 5);
    c.fillStyle = C.deep;
    for (let x = -10 + (time * 40) % 24; x < W; x += 24) {
      c.beginPath(); c.moveTo(x, sy); c.lineTo(x + 12, sy); c.lineTo(x + 7, sy + 5); c.lineTo(x - 5, sy + 5); c.fill();
    }
    c.restore();
  }
  // Staff gauge: the marked ruler real reservoirs use to read the water level.
  const gx = W - 15, gTop = 7, gBot = top - 5;
  c.fillStyle = C.ground;
  c.globalAlpha = 0.8;
  c.fillRect(gx - 7, gTop - 2, 20, gBot - gTop + 4);
  c.globalAlpha = 1;
  c.strokeStyle = C.ink;
  c.lineWidth = 1;
  for (let i = 0; i <= 10; i++) {
    const y = gBot - (gBot - gTop) * i / 10;
    c.beginPath(); c.moveTo(gx - (i % 5 ? 2 : 5), y); c.lineTo(gx + 5, y); c.stroke();
  }
  const ly = gBot - (gBot - gTop) * f;
  c.fillStyle = f >= 0.99 ? C.value : C.hazard;
  c.beginPath(); c.moveTo(gx + 12, ly - 5); c.lineTo(gx + 12, ly + 5); c.lineTo(gx + 5, ly); c.fill();
  c.globalAlpha = 0.85;
  c.fillStyle = C.deep;
  c.fillRect(0, 0, 92, 54);
  c.globalAlpha = 1;
  c.textAlign = 'left';
  c.font = `18px ${fontDisplay}`;
  c.fillStyle = C.ink;
  c.fillText(`${Math.round(f * 100)}%`, 9, 22);
  c.font = `600 11px ${fontBody}`;
  c.fillStyle = C.muted;
  c.fillText('PRESSIONE', 9, 35);
  c.fillText(`fuga ${fmtEvery(leakRate())}`, 9, 48);
}

/* Each ball type charges on its own pie, then pops out over the reservoir. */
function drawSpawners(c, dt) {
  BALLS.forEach((b, k) => {
    if (!S.owned[k]) return;
    const x = WX(SPAWN_X[k]), y = view.resPx + (-RES + 0.05) * view.W, R = 11 + 4 * pieKick[k];
    pieKick[k] = Math.max(0, pieKick[k] - dt * 6);
    c.fillStyle = C.panel;
    c.beginPath(); c.arc(x, y, R, 0, 6.2832); c.fill();
    const fast = KRate[k] >= 6, share = fast ? 1 : emitAcc[k] % 1;
    c.fillStyle = b.hex;
    c.beginPath();
    c.moveTo(x, y);
    c.arc(x, y, R, -1.5708, -1.5708 + 6.2832 * share);
    c.closePath();
    c.fill();
    c.strokeStyle = b.hex;
    c.lineWidth = 2;
    c.beginPath(); c.arc(x, y, R, 0, 6.2832); c.stroke();
  });
}

function drawGates(c) {
  const W = view.W;
  for (const G of gates) {
    const color = G.type === 'split' ? C.split : C.value;
    const x0 = WX(G.x0), x1 = WX(G.x1), y = WY(G.y);
    const glow = G.flash;
    c.globalAlpha = 0.2 + 0.3 * glow;
    c.fillStyle = color;
    c.fillRect(x0, y - 9, x1 - x0, 18);
    c.globalAlpha = 1;
    c.fillRect(x0, y - 2 - glow, x1 - x0, 4 + 2 * glow);
    const label = `${G.type === 'split' ? 'PALLINE' : 'VALORE'} ×${fmtMult(gateMult(G))}`;
    c.font = `700 ${12 + 2 * glow}px ${fontBody}`;
    const tw = c.measureText(label).width + 10;
    const cx = (x0 + x1) / 2;
    c.fillStyle = C.deep;
    c.fillRect(cx - tw / 2, y - 8, tw, 16);
    c.fillStyle = color;
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillText(label, cx, y + 0.5);
    c.textBaseline = 'alphabetic';
  }
}

function drawFloaters(c, dt) {
  c.textAlign = 'center';
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.t += dt;
    if (f.t > 0.9) { floaters.splice(i, 1); continue; }
    c.globalAlpha = 1 - f.t / 0.9;
    c.font = `${f.size}px ${fontDisplay}`;
    c.fillStyle = C.ink;
    c.strokeStyle = C.deep;
    c.lineWidth = 3;
    const y = f.y - f.t * 46;
    c.strokeText(f.txt, f.x, y);
    c.fillText(f.txt, f.x, y);
  }
  c.globalAlpha = 1;
}

function draw(dt) {
  const f = holdTimer > 0 ? heldFill : damFill();
  const jitter = holdTimer > 0 ? 0.005 : 0.0012 * f * f * f;
  let w = 0;
  for (let i = 0; i < n; i++, w += 4) {
    glF[w] = px[i]; glF[w + 1] = py[i]; glF[w + 2] = rad[i]; glU[w + 3] = col[i];
  }
  for (let i = 0; i < bn; i++, w += 4) {
    glF[w] = bx[i] + (jitter ? Math.sin(time * 31 + i * 1.7) * jitter : 0);
    glF[w + 1] = by[i] + (jitter ? Math.cos(time * 27 + i) * jitter : 0);
    glF[w + 2] = br[i]; glU[w + 3] = COLS[bk[i]][0];
  }
  const total = n + bn;
  if (gl) {
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform2f(uRes, view.W, view.H);
    gl.uniform1f(uScale, view.W);
    gl.uniform1f(uTop, view.resPx);
    gl.uniform1f(uDpr, view.dpr);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, new Float32Array(glData, 0, total * 4));
    gl.drawArrays(gl.POINTS, 0, total);
  }
  const c = fxCtx;
  c.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  c.clearRect(0, 0, view.W, view.H);
  if (!gl) {
    c.fillStyle = C.ball;
    for (let i = 0; i < n; i++) c.fillRect(WX(px[i]) - 2, WY(py[i]) - 2, 4, 4);
    for (let i = 0; i < bn; i++) c.fillRect(WX(bx[i]) - 3, WY(by[i]) - 3, 6, 6);
  }
  drawGates(c);
  drawDam(c, f);
  drawSpawners(c, dt);
  drawFloaters(c, dt);
  for (const G of gates) G.flash = Math.max(0, G.flash - dt * 4);
  if (flash > 0) {
    c.fillStyle = C.ink;
    c.globalAlpha = flash * 0.5;
    c.fillRect(0, 0, view.W, view.H);
    c.globalAlpha = 1;
    flash = Math.max(0, flash - dt * 2.5);
  }
  if (shake > 0.2 && !reduceMotion) {
    field.style.transform = `translate(${(Math.random() - 0.5) * shake}px, ${(Math.random() - 0.5) * shake}px)`;
    shake *= Math.pow(0.03, dt);
  } else if (field.style.transform) {
    field.style.transform = '';
    shake = 0;
  }
}

/* ========================= Interface ========================= */
const nf = new Intl.NumberFormat('it-IT', { maximumFractionDigits: 0 });
const nf1 = new Intl.NumberFormat('it-IT', { maximumFractionDigits: 1 });
const nf2 = new Intl.NumberFormat('it-IT', { maximumSignificantDigits: 3 });
const UNITS = ['', 'k', 'M', 'Mld', 'T', 'aa', 'ab', 'ac', 'ad'];
function fmt(v) {
  if (!isFinite(v)) return '∞';
  if (v < 10000) return nf.format(Math.floor(v));
  const e = Math.min(UNITS.length - 1, Math.floor(Math.log10(v) / 3));
  return nf2.format(v / Math.pow(1000, e)) + ' ' + UNITS[e];
}
const fmtMult = v => nf1.format(v);

const costAt = ([base, grow], lv) => base * Math.pow(grow, lv);
const fmtRate = v => nf2.format(v);
/* Slow rates read better as a period: "ogni 10 s" instead of "0,1 al secondo". */
function fmtEvery(rate) {
  if (rate <= 0) return 'nessuna';
  return rate < 1 ? `1 ogni ${nf1.format(1 / rate)} s` : `${fmtRate(rate)} al s`;
}
function ballItems(i) {
  const b = BALLS[i], L = S.lv[i];
  if (!S.owned[i]) {
    return [{
      id: `unlock.${i}`, name: `Sblocca ${b.name}`, effect: b.blurb, cost: b.unlock, can: true,
      wide: true,
      apply: () => { S.owned[i] = true; },
    }];
  }
  const perkMaxed = L.perk >= b.perkMax;
  return [
    {
      id: `${i}.rate`, name: 'Frequenza', cost: costAt(b.costs.rate, L.rate), can: true,
      effect: `${fmtEvery(rateOf(i))} → ${fmtEvery(rateAt(i, L.rate + 1))}`,
      apply: () => { L.rate++; },
    },
    {
      id: `${i}.value`, name: 'Valore', cost: costAt(b.costs.value, L.value), can: true,
      effect: `${fmtRate(valueOf(i))} → ${fmtRate(valueAt(i, L.value + 1))} monete`,
      apply: () => { L.value++; },
    },
    {
      id: `${i}.perk`, name: b.perkName, cost: costAt(b.costs.perk, L.perk), can: !perkMaxed,
      effect: perkMaxed ? 'al massimo' : b.perkText(L.perk),
      apply: () => { L.perk++; },
    },
  ];
}

function damItems() {
  const leakNow = leakK() * 100;
  return [
    {
      id: 'dam', name: 'Capienza', cost: costAt(TUNE.costCap, S.damLv), can: true,
      effect: `${fmt(damCap())} → ${fmt(damCap() * TUNE.capGrow)} palline`,
      apply: () => { S.damLv++; },
    },
    {
      id: 'seal', name: 'Tenuta', cost: costAt(TUNE.costSeal, S.sealLv), can: true,
      effect: `fuga ${fmtRate(leakNow)}% → ${fmtRate(leakNow * TUNE.sealGrow)}% al s`,
      apply: () => { S.sealLv++; },
    },
    {
      id: 'bonus', name: 'Paratoie', cost: costAt(TUNE.costBonus, S.bonusLv), can: true,
      effect: `valanga piena ×${fmtMult(1 + bonusMax())} → ×${fmtMult(1 + bonusMax() + TUNE.bonusStep)}`,
      apply: () => { S.bonusLv++; },
    },
  ];
}

function towerItems() {
  const allGates = S.gates >= MAX_FLOORS * 3;
  const nextGate = allGates ? null : GATE_PLAN[Math.floor(S.gates / 3)][S.gates % 3];
  return [
    {
      id: 'gate',
      name: allGates ? 'Potenzia valore' : 'Nuova barriera',
      cost: allGates ? costAt(TUNE.costBoost, S.boost) : costAt(TUNE.costGate, S.gates - 1),
      can: allGates || S.gates < S.floors * 3,
      effect: allGates ? 'barriere valore +50%'
        : S.gates >= S.floors * 3 ? 'serve un nuovo piano'
        : `${nextGate[0] === 'split' ? 'palline' : 'valore'} ×${nextGate[1]}`,
      apply: () => { if (allGates) S.boost++; else S.gates++; layout(); },
    },
    {
      id: 'floor', name: S.floors < MAX_FLOORS ? `Piano ${S.floors + 1}` : 'Torre completa',
      cost: TUNE.costFloor[S.floors - 1], can: S.floors < MAX_FLOORS,
      effect: S.floors < MAX_FLOORS ? 'la cascata si allunga' : `${MAX_FLOORS} piani costruiti`,
      apply: () => { S.floors++; layout(); },
    },
  ];
}
function crystalItems() {
  const gain = crystalGain(), nextAt = TUNE.crystalScale * Math.pow(gain + 1, 3);
  const perm = (id, name, key, grow, label) => ({
    id: `perm.${id}`, name, cost: Math.ceil(costAt(TUNE.costPerm, S.perm[key])), can: true, crystal: true,
    effect: `${label} ×${fmtMult(Math.pow(grow, S.perm[key]))} → ×${fmtMult(Math.pow(grow, S.perm[key] + 1))}`,
    apply: () => { S.perm[key]++; },
  });
  return [
    perm('rate', 'Sorgente', 'rate', TUNE.permRate, 'frequenza'),
    perm('value', 'Conio', 'value', TUNE.permValue, 'valore'),
    perm('cap', 'Bacino', 'cap', TUNE.permCap, 'capienza'),
    {
      id: 'rebuild', name: 'Ricostruisci', cost: 0, can: gain >= 1, rebuild: true,
      costText: `+${nf.format(gain)} ◆`,
      effect: `prossimo a ${fmt(nextAt)} monete`,
      apply: () => {},
    },
  ];
}
const tabItems = t => (t === DAM_TAB ? damItems() : t === TOWER_TAB ? towerItems() : t === CRYSTAL_TAB ? crystalItems() : ballItems(t));
const allItems = () => [...BALLS.flatMap((b, i) => ballItems(i)), ...damItems(), ...towerItems()];

const canPay = item => item.can && (item.rebuild || (item.crystal ? S.crystals : S.coins) >= item.cost);
function buyItem(item) {
  if (item.rebuild || !canPay(item)) return false;
  if (item.crystal) S.crystals -= item.cost; else S.coins -= item.cost;
  item.apply();
  refreshKinds();
  save();
  return true;
}
function buy(id) {
  const item = allItems().find(it => it.id === id);
  return item ? buyItem(item) : false;
}

const tabsEl = $('tabs');
const tabEls = [...BALLS.map((b, i) => [b.name, b.hex, i]), ['Diga', C.hazard, DAM_TAB], ['Torre', C.concrete, TOWER_TAB], ['Cristalli', C.split, CRYSTAL_TAB]].map(([label, hex, i]) => {
  const el = document.createElement('button');
  el.type = 'button';
  el.className = i >= PLANT_TAB ? 'tab plant' : 'tab';
  el.id = `tab-${i}`;
  el.setAttribute('role', 'tab');
  el.style.setProperty('--dot', hex);
  el.innerHTML = '<span class="dot"></span><span class="tab-label"></span>';
  el.children[1].textContent = label;
  el.addEventListener('click', () => { S.tab = i; audio.init(); refreshUI(); });
  tabsEl.append(el);
  return el;
});
const slots = [0, 1, 2, 3].map(i => {
  const el = $(`slot-${i}`);
  el.innerHTML = '<span class="name"></span><span class="cost"></span><span class="effect"></span>';
  const slot = { el, name: el.children[0], cost: el.children[1], effect: el.children[2], item: null };
  el.addEventListener('click', () => {
    audio.init();
    if (slot.item && slot.item.rebuild) { if (canPay(slot.item)) openRebuild(); return; }
    if (slot.item && buyItem(slot.item)) { audio.click(); refreshUI(); }

});

const hintEl = $('hint');
const coinsEl = $('coins'), incomeEl = $('income'), liveEl = $('live'), statsEl = $('stats');
const damBtn = $('dam-btn'), damMain = damBtn.querySelector('.main'), damSub = damBtn.querySelector('.sub');
const resultEl = $('result');
let shownCoins = S.coins, resultTimer = 0;

function setText(el, text) { if (el.textContent !== text) el.textContent = text; }
function refreshUI() {
  setText(coinsEl, fmt(shownCoins));
  setText(liveEl, fmt(liveLogical));
  const f = damFill(), busy = holdTimer > 0 || floodActive;
  const ready = !busy && f >= TUNE.minOpen;
  damBtn.disabled = !ready;
  damBtn.classList.toggle('ready', ready);
  damBtn.classList.toggle('full', ready && f >= 0.999);
  damBtn.style.setProperty('--fill', `${(f * 100).toFixed(1)}%`);
  setText(damMain, busy ? 'VALANGA!' : f >= 0.999 ? 'DIGA PIENA: APRI!' : 'APRI LA DIGA');
  setText(damSub, busy ? `${fmt(floodGain)} monete finora`
    : ready ? `${fmt(damTotal())} palline · valore ×${fmtMult(pressure(f))}`
    : `Serve il ${Math.round(TUNE.minOpen * 100)}% di pressione: ora ${Math.round(f * 100)}%`);

  tabEls.forEach((el, i) => {
    el.setAttribute('aria-selected', String(S.tab === i));
    el.classList.toggle('locked', i < PLANT_TAB && !S.owned[i]);
    el.hidden = i === CRYSTAL_TAB && !crystalsVisible();
    el.classList.toggle('alert', tabItems(i).some(canPay));
  });
  const items = tabItems(S.tab);
  slots.forEach((slot, i) => {
    const item = items[i] || null;
    slot.item = item;
    slot.el.hidden = !item;
    if (!item) return;
    const afford = canPay(item);
    slot.el.disabled = !afford;
    slot.el.classList.toggle('perma', !!item.rebuild && afford);
    slot.el.classList.toggle('buy', afford);
    slot.el.classList.toggle('wide', !!item.wide);
    slot.el.classList.toggle('span', items.length === 2 || (items.length % 2 === 1 && i === items.length - 1 && !item.wide));
    setText(slot.name, item.name);
    setText(slot.cost, item.costText || (item.can && isFinite(item.cost) ? `${fmt(item.cost)}${item.crystal ? ' ◆' : ''}` : ''));
    setText(slot.effect, item.effect);
  });
  hintEl.hidden = !!S.tapped;
}

  add('small', small);

}

}
damBtn.addEventListener('click', tryOpen);
fxCanvas.addEventListener('pointerdown', e => {
  audio.init();
  tapCharge();
  S.tapped = true;
  audio.blip(2);
});
$('mute-btn').addEventListener('click', e => {
  audio.init();
  audio.setMuted(!audio.muted);
  e.currentTarget.textContent = audio.muted ? 'Audio no' : 'Audio sì';
});
function hardReset() {
  Object.assign(S, freshState());
  resetRun();
}
function resetRun() {
  n = 0; bn = 0; liveLogical = 0; floodLive = 0; floodActive = false; holdTimer = 0; leakAcc = 0;
  emitAcc.fill(0);
  emitAcc[0] = 0.4;
  floaters.length = 0; incomeWindow.length = 0;
  exitGain = 0; exitBurst = 0; floaterGain = 0; lastFlood = null;
  refreshKinds();
  doorTarget = 0; doorOpen = 0;
  shownCoins = 0;
  layout();
  save();
}
const resetBtn = $('reset-btn');
let resetArmed = 0;
resetBtn.addEventListener('click', () => {
  if (Date.now() - resetArmed < 3000) {
    hardReset();
    resetBtn.textContent = 'Ricomincia';
    resetArmed = 0;
    return;
  }
  resetArmed = Date.now();
  resetBtn.textContent = 'Sicuro?';
  setTimeout(() => { resetBtn.textContent = 'Ricomincia'; }, 3000);
});

/* ========================= Main loop ========================= */
const H = 1 / 60;
let floaterGain = 0, lastFloater = 0;
let running = false, last = 0, acc = 0, uiClock = 0, statClock = 0, frames = 0, frameMs = 0, fps = 60, noteStep = 0;

function frame(t) {
  const raw = (t - last) / 1000;
  last = t;
  const dt = Math.min(raw, 0.05);
  acc += dt;
  let steps = 3;
  while (acc >= H && steps-- > 0) { tick(H); acc -= H; }
  if (steps <= 0) acc = 0;

  if (gateHits > 0) {
    noteStep = floodActive ? Math.min(24, Math.floor(Math.log2(1 + floodHits) * 1.4)) : (noteStep + 1) % 5;
    audio.blip(noteStep);
    gateHits = 0;
  }
  uiClock += dt;
  statClock += raw; frames++; frameMs += raw * 1000;
  if (uiClock > 0.12) {
    if (exitGain > 0) {
      incomeWindow.push([t, exitGain]);
      floaterGain += exitGain;
      exitGain = 0;
    }
    if (floaterGain > 0 && t - lastFloater > 420) {
      const size = Math.min(26, 13 + Math.log10(1 + floaterGain) * 1.6);
      floaters.push({ x: view.W * (0.3 + 0.4 * Math.random()), y: view.H - 10, txt: `+${fmt(floaterGain)}`, size, t: 0 });
      floaterGain = 0;
      lastFloater = t;
    }
    audio.rain(Math.min(0.32, exitBurst / 500));
    exitBurst = 0;
    uiClock = 0;
    while (incomeWindow.length && t - incomeWindow[0][0] > 4000) incomeWindow.shift();
    shownCoins += (S.coins - shownCoins) * 0.45;
    if (Math.abs(S.coins - shownCoins) < 1) shownCoins = S.coins;
    const rate = incomeWindow.reduce((a, b) => a + b[1], 0) / 4;
    setText(incomeEl, `${fmt(rate)} al secondo${S.crystals > 0 ? ` · ${nf.format(S.crystals)} ◆` : ''}`);
    refreshUI();
  }
  if (statClock >= 1) {
    fps = frames / statClock;
    const avg = frameMs / frames;
    if (avg > 24 && n > softCap * 0.6) softCap = Math.max(4000, Math.floor(softCap * 0.8));
    else if (avg < 18) softCap = Math.min(MAX, Math.floor(softCap * 1.05));
    setText(statsEl, `${Math.round(fps)} fps · ${nf.format(n)} sim · max ${nf.format(softCap)}${window.VALANGA_BUILD ? ` · ${window.VALANGA_BUILD}` : ""}`);
    statClock = 0; frames = 0; frameMs = 0;
  }
  draw(dt);
  requestAnimationFrame(frame);
}

function welcomeBack() {
  const away = (Date.now() - (S.savedAt || Date.now())) / 1000;
  if (away < 30) return;
  // Stock approaches the level where leaks balance the incoming balls.
  const flow = KFlow.reduce((a, b) => a + b, 0), k = leakK(), before = damTotal();
  const balance = Math.max(0, (flow - TUNE.leakBase) / k);
  const after = Math.min(damCap(), balance + (before - balance) * Math.exp(-k * away));
  if (after <= before + 1) return;
  BALLS.forEach((b, i) => { S.store[i] += (after - before) * KFlow[i] / flow; });
  floaters.push({ x: view.W / 2, y: view.resPx + 70, txt: 'La diga è salita mentre eri via', size: 15, t: -1.2 });
}

initGL();
resize();
new ResizeObserver(resize).observe(field);
window.addEventListener('pagehide', save);
setInterval(save, 5000);
welcomeBack();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => drawBg());
refreshUI();
running = true;
last = performance.now();
requestAnimationFrame(frame);

/* Hooks for automated pacing and stress tests. */
window.__valanga = {
  S, TUNE, BALLS, tick, openDam, buy, allItems, buyItem, damFill, damCap, damTotal, leakRate, layout, hardReset, crystalItems, crystalGain, rebuild, welcomeBack, tapCharge, refreshKinds,
  set headless(v) { headless = v; if (v) bn = 0; },
  get bodies() { return bn; },
  set softCap(v) { softCap = v; },
  get stats() { return { n, softCap, liveLogical, fps, floodActive, floodGain, floodPeak, webgl: !!gl }; },
};
</script>
